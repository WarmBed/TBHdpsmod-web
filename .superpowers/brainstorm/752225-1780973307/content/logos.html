<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo options</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8f9fb;color:#0d1117;padding:32px}
  h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:#5b6675;font-size:14px;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:1100px}
  .card{background:#fff;border:1px solid #e3e5ea;border-radius:16px;padding:20px;display:flex;align-items:center;gap:22px}
  .card .num{font-size:30px;font-weight:800;width:34px;flex:none;text-align:center}
  .tile{width:96px;height:96px;border-radius:20px;border:1px solid #eceef2;display:flex;align-items:center;justify-content:center;flex:none;color:#0d1117}
  .appicon{width:56px;height:56px;border-radius:14px;background:#0d1117;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
  .nav{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e3e5ea;border-radius:12px;padding:10px 14px}
  .navmark{width:26px;height:26px;border-radius:8px;background:#0d1117;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .navtxt{font-weight:800;font-size:14px}
  .navlinks{color:#5b6675;font-size:12px;margin-left:6px}
  .navdl{margin-left:auto;background:#0d1117;color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:7px}
  .meta{flex:none;width:120px}
  .meta .name{font-size:13px;color:#5b6675;margin-top:4px}
  svg{display:block}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
  .lbl{font-size:10px;color:#9aa4b2;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<h1>平面化單色 Logo — 8 個方案</h1>
<p class="sub">每個方案同時顯示：大圖示、深色 App icon、以及實際 nav 列裡的樣子。挑一個號碼跟我說。</p>
<div class="grid" id="grid"></div>

<script>
const C = 'currentColor';
const icons = {
  'Crossed swords': `<g stroke="${C}" stroke-width="6" stroke-linecap="round" fill="none"><line x1="16" y1="48" x2="48" y2="16"/><line x1="16" y1="16" x2="48" y2="48"/></g>`,
  'DPS bars': `<g fill="${C}"><rect x="12" y="40" width="8" height="14" rx="2"/><rect x="25" y="30" width="8" height="24" rx="2"/><rect x="38" y="20" width="8" height="34" rx="2"/><rect x="51" y="10" width="8" height="44" rx="2"/></g>`,
  'Single sword': `<g stroke="${C}" stroke-linecap="round" fill="none"><line x1="18" y1="48" x2="44" y2="20" stroke-width="6"/><line x1="34" y1="18" x2="48" y2="30" stroke-width="5"/><line x1="14" y1="44" x2="22" y2="52" stroke-width="5"/></g>`,
  'Gauge / meter': `<g fill="none" stroke="${C}" stroke-width="6" stroke-linecap="round"><path d="M12 46 A20 20 0 0 1 52 46"/><line x1="32" y1="46" x2="44" y2="28"/></g><circle cx="32" cy="46" r="4" fill="${C}"/>`,
  'Lightning': `<path d="M36 8 L18 36 L29 36 L26 56 L48 26 L35 26 Z" fill="${C}"/>`,
  'Pulse line': `<polyline points="10,38 22,38 28,22 35,50 41,30 47,38 56,38" fill="none" stroke="${C}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
  'Target': `<g fill="none" stroke="${C}" stroke-width="5"><circle cx="32" cy="32" r="17"/><circle cx="32" cy="32" r="6" fill="${C}" stroke="none"/></g><g stroke="${C}" stroke-width="5" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="16"/><line x1="32" y1="48" x2="32" y2="58"/><line x1="6" y1="32" x2="16" y2="32"/><line x1="48" y1="32" x2="58" y2="32"/></g>`,
  'Bars + bolt': `<g fill="${C}"><rect x="10" y="38" width="8" height="16" rx="2"/><rect x="22" y="30" width="8" height="24" rx="2"/><rect x="34" y="22" width="8" height="32" rx="2"/></g><path d="M48 10 L38 26 L45 26 L42 40 L56 22 L49 22 Z" fill="${C}"/>`,
};
function svg(inner, size){return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">${inner}</svg>`}
const grid = document.getElementById('grid');
Object.entries(icons).forEach(([name, inner], i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="num">${i+1}</div>
    <div class="col"><div class="tile">${svg(inner,52)}</div><div class="lbl">mark</div></div>
    <div class="col"><div class="appicon">${svg(inner,32)}</div><div class="lbl">icon</div></div>
    <div class="nav">
      <span class="navmark">${svg(inner,16)}</span>
      <span class="navtxt">TBH DPS Meter</span>
      <span class="navlinks">功能 · 安裝 · FAQ</span>
      <span class="navdl">下載</span>
    </div>
    <div class="meta"><div class="name">${name}</div></div>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
